plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// Minecraft 1.21.1 uses LWJGL 3.3.3. Keep the Vulkan binding aligned with
// Minecraft's LWJGL version to avoid loading two incompatible LWJGL copies.
def lwjglVersion = '3.3.3'
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def lwjglClassifier
if (osName.contains('mac')) {
    lwjglClassifier = (osArch.contains('aarch64') || osArch.contains('arm64')) ? 'natives-macos-arm64' : 'natives-macos'
} else if (osName.contains('win')) {
    lwjglClassifier = 'natives-windows'
} else if (osName.contains('linux')) {
    lwjglClassifier = (osArch.contains('aarch64') || osArch.contains('arm64')) ? 'natives-linux-arm64' : 'natives-linux'
} else {
    throw new GradleException("Unsupported build platform for AetherVK bootstrap: ${osName}/${osArch}")
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    runtimeOnly "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:${lwjglClassifier}"
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main

        dependencies {
            runtime "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
            runtime "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:${lwjglClassifier}"
        }
    }
    client {}
    server { argument '--nogui' }
}


processResources {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': 'AetherVK contributors',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'AetherVK contributors'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
